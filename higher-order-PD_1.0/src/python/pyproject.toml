[build-system]
requires = [
    "setuptools>=68",
]
build-backend = "setuptools.build_meta"

[project]
name = "graph-benchmark"
version = "0.1.0"
description = "Python analysis for the graph benchmark experiments."
requires-python = ">=3.11,<3.14"
dependencies = [
    "gudhi>=3.10,<3.14",
    "matplotlib>=3.8,<3.12",
    "networkx>=3.0,<4",
    "numpy>=1.22,<3",
    "scikit-learn>=1.3,<2",
]

[tool.setuptools]
packages = [
    "core",
    "experiments",
    "experiments.random_graph_classification",
    "methods",
    "methods.graph_statistics",
    "methods.TDA",
    "methods.TDA.persistence_images",
    "methods.TDA.persistence_landscapes",
]